    <style>
        /* استایل‌های مشابه با تغییرات رنگ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', 'Arial', sans-serif;
        }
        body {
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: white;

            padding: 20px;

        }

            margin-bottom: 20px;

            font-size: 14px;
        }

            border: 2px solid #ddd;

            font-size: 14px;

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;

            margin: 5px 0;

        .btn-info { background: #2196F3; color: white; }
        .btn-success { background: #4CAF50; color: white; }

        .btn-danger { background: #f44336; color: white; }
        .btn-warning { background: #FF9800; color: white; }

        }

            background: #f9f9f9;
            border-radius: 12px;
            padding: 15px;

            border-right: 4px solid #2196F3;
        }
        .hidden { display: none; }
        .message {

            font-weight: bold;
        }
        .status-active { background: #4CAF50; color: white; }
        .status-inactive { background: #f44336; color: white; }
        .map-container {
            width: 100%;
            height: 400px;
            background: #e9ecef;
            border-radius: 12px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            font-size: 14px;

            max-height: 250px;

            margin: 10px 0;

        .chat-message.self {

            color: #2196F3;

    <script>
        // ============================================
        // متغیرهای سراسری

        let currentSerial = '';
        let currentUsername = '';
        let currentChatPermission = 'read_write';
        let locationInterval = null;
        let chatInterval = null;
        
        // ============================================

        // ============================================
        
        // تابع نمایش فرم ثبت‌نام - شماره 001
        function showRegister_001() {
            document.getElementById('registerSection').classList.remove('hidden');
            document.getElementById('loginSection').classList.add('hidden');
            
            // بارگذاری اطلاعات ذخیره شده
            const savedSerial = localStorage.getItem('user_serial');
            const savedName = localStorage.getItem('user_name');
            if (savedSerial) document.getElementById('registerSerial').value = savedSerial;
            if (savedName) document.getElementById('registerName').value = savedName;
        }
        // پایان تابع showRegister_001
        
        // تابع نمایش فرم ورود - شماره 002
        function showLogin_002() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('registerSection').classList.add('hidden');
            
            // بارگذاری اطلاعات ذخیره شده
            const savedSerial = localStorage.getItem('user_serial');
            const savedUsername = localStorage.getItem('user_username');
            const savedPassword = localStorage.getItem('user_password');
            if (savedSerial) document.getElementById('userSerial').value = savedSerial;
            if (savedUsername) document.getElementById('userUsername').value = savedUsername;
            if (savedPassword) document.getElementById('userPassword').value = savedPassword;
        }
        // پایان تابع showLogin_002
        
        // تابع ثبت‌نام کاربر - شماره 003
        function userRegister_003() {
            const serial = document.getElementById('registerSerial').value.trim();
            const name = document.getElementById('registerName').value.trim();
            const phone = document.getElementById('registerPhone').value.trim();
            const messageDiv = document.getElementById('registerMessage');
            
            if (!serial || !name || !phone) {
                showMessage_999(messageDiv, 'همه فیلدها را پر کنید', 'error');
                return;
            }
            
            fetch('karvan_manager.php?action=user_register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    serial: parseInt(serial),
                    username: name,
                    phone: phone
                })
            })
            .then(response => response.json())
            .then(data => {
                showMessage_999(messageDiv, data.message, data.status);
                if (data.status === 'success') {
                    // ذخیره سریال برای استفاده بعدی
                    localStorage.setItem('user_serial', serial);
                    localStorage.setItem('user_name', name);
                }
            })
            .catch(error => {
                showMessage_999(messageDiv, 'خطا در ارتباط با سرور', 'error');
                console.error('Error:', error);
            });
        }
        // پایان تابع userRegister_003
        
        // تابع مخفی کردن فرم ثبت‌نام - شماره 004
        function hideRegister_004() {
            document.getElementById('registerSection').classList.add('hidden');
        }
        // پایان تابع hideRegister_004
        
        // تابع ورود کاربر - شماره 005
// تابع ورود کاربر - شماره 005
function userLogin_005() {
    const serial = document.getElementById('userSerial').value.trim();
    const username = document.getElementById('userUsername').value.trim();
    const password = document.getElementById('userPassword').value.trim();
    const messageDiv = document.getElementById('loginMessage');
    
    if (!serial || !username || !password) {
        showMessage_999(messageDiv, 'همه فیلدها را پر کنید', 'error');
        return;
    }
    
    fetch('karvan_manager.php?action=user_login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            serial: parseInt(serial),
            username: username,
            password: password
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            currentSerial = serial;
            currentUsername = username;
            currentChatPermission = data.chat_permission || 'read_write';
            
            document.getElementById('userNameDisplay').textContent = '👤 ' + data.username;
            
            // ذخیره اطلاعات
            localStorage.setItem('user_serial', serial);
            localStorage.setItem('user_username', username);
            localStorage.setItem('user_password', password);
            
            document.getElementById('entrySection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            
            // تنظیم دسترسی چت
            if (currentChatPermission === 'no_access' || currentChatPermission === 'read_only') {
                document.getElementById('chatInput').disabled = true;
                if (currentChatPermission === 'no_access') {
                    document.getElementById('chatSection').style.display = 'none';
                } else {
                    document.getElementById('chatInput').placeholder = 'دسترسی فقط خواندن';
                }
            }
            
            // ابتدا درخواست مجوز موقعیت
            requestLocationPermission_014();
            
            // بارگذاری اولیه چت
            loadChatMessages_012();
            // بارگذاری اولیه نقشه
            loadGroupMap_008();
            
            showMessage_999(messageDiv, '✅ ورود موفق', 'success');
        } else {
            showMessage_999(messageDiv, data.message, 'error');
            if (data.message.includes('منقضی')) {
                localStorage.removeItem('user_serial');
                localStorage.removeItem('user_username');
                localStorage.removeItem('user_password');
            }
        }
    })
    .catch(error => {
        showMessage_999(messageDiv, 'خطا در ارتباط با سرور', 'error');
        console.error('Error:', error);
    });
}

// تابع ارسال موقعیت لحظه‌ای - شماره 007
function sendLocationNow_007() {
    const statusDiv = document.getElementById('locationStatus');
    statusDiv.textContent = '⏳ در حال دریافت موقعیت...';
    
    if (!navigator.geolocation) {
        statusDiv.textContent = '❌ مرورگر شما از موقعیت‌یابی پشتیبانی نمی‌کند';
        return;
    }
    
    // گزینه‌های موقعیت‌یابی با دقت بالا و timeout مناسب
    const options = {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 60000
    };
    
    navigator.geolocation.getCurrentPosition(
        function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const time = new Date().toISOString().replace('T', ' ').slice(0, 19);
            
            sendLocationToServer_013(lat, lng, time, function(success) {
                if (success) {
                    statusDiv.textContent = '✅ موقعیت با موفقیت ارسال شد (GPS)';
                    setTimeout(() => {
                        statusDiv.textContent = '📡 موقعیت‌یابی فعال';
                    }, 3000);
                } else {
                    statusDiv.textContent = '❌ خطا در ارسال موقعیت';
                }
            });
        },
        function(error) {
            console.warn('GPS Error:', error);
            statusDiv.textContent = '⏳ GPS در دسترس نیست، تلاش با روش جایگزین...';
            
            const fallbackOptions = {
                enableHighAccuracy: false,
                timeout: 10000,
                maximumAge: 120000
            };
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const time = new Date().toISOString().replace('T', ' ').slice(0, 19);
                    
                    sendLocationToServer_013(lat, lng, time, function(success) {
                        if (success) {
                            statusDiv.textContent = '✅ موقعیت با موفقیت ارسال شد (تقریبی)';
                            setTimeout(() => {
                                statusDiv.textContent = '📡 موقعیت‌یابی فعال (تقریبی)';
                            }, 3000);
                        } else {
                            statusDiv.textContent = '❌ خطا در ارسال موقعیت';
                        }
                    });
                },
                function(fallbackError) {
                    statusDiv.textContent = '❌ خطا در دریافت موقعیت: ' + fallbackError.message;
                    console.error('Fallback error:', fallbackError);
                },
                fallbackOptions
            );
        },
        options
    );
}
// پایان تابع sendLocationNow_007
        // پایان تابع sendLocationNow_007
        
        // تابع بارگذاری نقشه گروهی - شماره 008
// تابع بارگذاری نقشه گروهی - شماره 008
// ورودی: دریافت لیست موقعیت‌ها از سرور
// خروجی: نمایش نقشه با موقعیت افراد
let map = null;
let mapMarkers = {};

function loadGroupMap_008() {
    const container = document.getElementById('mapContainer');
    
    if (!currentSerial) {
        container.innerHTML = '?? شماره سريال مشخص نيست';
        return;
    }
    
    // اگر نقشه وجود دارد، فقط نشانگرها را بروزرساني مي‌کنيم
    if (map) {
        updateGroupMarkers_017();
        return;
    }
    
    // اگر نقشه وجود ندارد، ايجاد مي‌کنيم
    container.innerHTML = '';
    container.style.height = '400px';
    container.style.width = '100%';
    
    map = L.map(container.id).setView([35.6892, 51.3890], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);
    
    updateGroupMarkers_017();
}
// پايان تابع loadGroupMap_008
// پایان تابع loadGroupMap_008
        // پایان تابع loadGroupMap_008

// تابع بروزرساني نشانگرهاي نقشه گروهي - شماره 017
function updateGroupMarkers_017() {
    if (!map) return;
    
    fetch(`karvan_manager.php?action=get_locations&serial=${currentSerial}`)
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            // حذف نشانگرهاي قبلي
            Object.values(mapMarkers).forEach(marker => {
                map.removeLayer(marker);
            });
            mapMarkers = {};
            
            if (data.data.length === 0) {
                return;
            }
            
            data.data.forEach(loc => {
                const isSelf = loc.username === currentUsername;
                const isLeader = loc.username === 'leader';
                
                const iconColor = isLeader ? '#FF9800' : (isSelf ? '#2196F3' : '#4CAF50');
                const iconText = isLeader ? '??' : (isSelf ? '??' : '');
                
                const icon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div style="background-color:${iconColor};width:30px;height:30px;border-radius:50%;border:3px solid white;box-shadow:0 3px 10px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:14px;color:white;font-weight:bold;">${iconText}</div>`,
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                
                const marker = L.marker([loc.latitude, loc.longitude], { icon: icon })
                    .addTo(map)
                    .bindPopup(`
                        <div style="direction:rtl;text-align:right;font-family:Tahoma;">
                            <h4 style="margin:0 0 5px 0;color:#333;">${isLeader ? '?? ' : ''}${loc.username} ${isSelf ? '(شما)' : ''}</h4>
                            <hr style="margin:5px 0;">
                            <p style="margin:3px 0;font-size:13px;color:#666;">
                                <strong>عرض:</strong> ${loc.latitude}<br>
                                <strong>طول:</strong> ${loc.longitude}<br>
                                <strong>زمان:</strong> ${loc.location_time}
                            </p>
                        </div>
                    `);
                
                mapMarkers[loc.username] = marker;
            });
            
            if (Object.keys(mapMarkers).length > 0) {
                const group = L.featureGroup(Object.values(mapMarkers));
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }
    })
    .catch(error => {
        console.error('Error:', error);
    });
}
// پايان تابع updateGroupMarkers_017
        
        // تابع ارسال پیام چت - شماره 009
        function sendChatMessage_009() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message || !currentSerial || currentChatPermission !== 'read_write') {
                if (currentChatPermission !== 'read_write') {
                    alert('شما اجازه ارسال پیام ندارید');
                }
                return;
            }
            
            fetch('karvan_manager.php?action=send_chat_message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    serial: parseInt(currentSerial), 
                    username: currentUsername, 
                    message: message 
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    input.value = '';
                    loadChatMessages_012();
                } else {
                    alert('خطا در ارسال پیام: ' + data.message);
                }
            })
            .catch(error => {
                alert('خطا در ارتباط با سرور');
                console.error('Error:', error);
            });
        }

// تابع شروع ردیابی موقعیت - شماره 011
function startLocationTracking_011() {
    if (locationInterval) {
        clearInterval(locationInterval);
        locationInterval = null;
    }
    
    if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: 'geolocation' }).then(function(result) {
            if (result.state === 'granted') {
                sendLocationNow_007();
                locationInterval = setInterval(function() {
                    sendLocationNow_007();
                }, 300000);
            } else {
                requestLocationPermission_014();
            }
        });
    } else {
        sendLocationNow_007();
        locationInterval = setInterval(function() {
            sendLocationNow_007();
        }, 300000);
    }
}

        // تابع بارگذاری پیام‌های چت - شماره 012
        function loadChatMessages_012() {
            const container = document.getElementById('chatBox');
            
            if (!currentSerial) {
                container.innerHTML = '<p style="color:#999;text-align:center;">شماره سریال مشخص نیست</p>';
                return;
            }
            
            fetch(`karvan_manager.php?action=get_chat_messages&serial=${currentSerial}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    if (data.data.length === 0) {
                        container.innerHTML = '<p style="color:#999;text-align:center;">هنوز پیامی ارسال نشده است</p>';
                        return;
                    }
                    
                    let html = '';
                    data.data.forEach(msg => {
                        const isSelf = msg.username === currentUsername;
                        const isLeader = msg.username === 'leader';
                        const icon = isLeader ? '👑' : '';
                        
                        html += `
                            <div class="chat-message ${isSelf ? 'self' : ''}">
                                <span class="user">${icon} ${msg.username} ${isSelf ? '(شما)' : ''}</span>
                                <span class="time">${msg.created_at}</span>
                                <div>${msg.message}</div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.scrollTop = container.scrollHeight;
                }
            })
            .catch(error => {
                container.innerHTML = '<p style="color:#999;text-align:center;">خطا در دریافت پیام‌ها</p>';
                console.error('Error:', error);
            });
        }
        // پایان تابع loadChatMessages_012
        
        // تابع ارسال موقعیت به سرور - شماره 013
        function sendLocationToServer_013(lat, lng, time, callback) {
            if (!currentSerial || !currentUsername) {
                if (callback) callback(false);
                return;
            }
            
            fetch('karvan_manager.php?action=send_location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    serial: parseInt(currentSerial),
                    username: currentUsername,
                    latitude: lat,
                    longitude: lng,
                    location_time: time
                })
            })
            .then(response => response.json())
            .then(data => {
                if (callback) callback(data.status === 'success');
            })
            .catch(error => {
                console.error('Error sending location:', error);
                if (callback) callback(false);
            });
        }
        // پایان تابع sendLocationToServer_013
// تابع درخواست مجوز موقعیت - شماره 014
// تابع درخواست مجوز موقعيت - شماره 014
function requestLocationPermission_014() {
    const statusDiv = document.getElementById('locationStatus');
    
    if (!navigator.geolocation) {
        statusDiv.textContent = '? مرورگر شما از موقعيت‌يابي پشتيباني نمي‌کند';
        return;
    }
    
    if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: 'geolocation' }).then(function(result) {
            if (result.state === 'granted') {
                statusDiv.textContent = '? دسترسي به موقعيت داده شده است';
                startLocationTracking_011();
            } else if (result.state === 'prompt') {
                statusDiv.textContent = '? درخواست دسترسي به موقعيت...';
                askForLocation_015();
            } else if (result.state === 'denied') {
                statusDiv.innerHTML = `
                    ? دسترسي به موقعيت در مرورگر رد شده است.
                    <br><br>
                    <strong style="color:#d32f2f;">براي فعال کردن:</strong>
                    <ol style="text-align:right;margin:10px 20px;font-size:13px;line-height:2;">
                        <li>روي آدرس سايت در نوار آدرس کليک کنيد</li>
                        <li>گزينه <strong>"Allow location access"</strong> را انتخاب کنيد</li>
                        <li>سپس روي دکمه زير کليک کنيد</li>
                    </ol>
                    <button class="btn btn-sm btn-warning" onclick="location.reload()" style="margin-top:10px;">
                        ?? بروزرساني صفحه
                    </button>
                `;
            }
        }).catch(function() {
            askForLocation_015();
        });
    } else {
        askForLocation_015();
    }
}
// پايان تابع requestLocationPermission_014
// پایان تابع requestLocationPermission_014

// تابع درخواست موقعیت - شماره 015
// تابع درخواست موقعيت - شماره 015
function askForLocation_015() {
    const statusDiv = document.getElementById('locationStatus');
    statusDiv.textContent = '?? در حال دريافت مجوز موقعيت...';
    
    navigator.geolocation.getCurrentPosition(
        function(position) {
            statusDiv.textContent = '? دسترسي به موقعيت داده شد';
            
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const time = new Date().toISOString().replace('T', ' ').slice(0, 19);
            
            sendLocationToServer_013(lat, lng, time, function(success) {
                if (success) {
                    statusDiv.textContent = '? موقعيت با موفقيت ارسال شد';
                } else {
                    statusDiv.textContent = '?? موقعيت دريافت شد اما در ارسال خطا رخ داد';
                }
            });
            
            startLocationTracking_011();
        },
        function(error) {
            console.warn('Location permission denied:', error);
            
            if (error.code === 1) {
                statusDiv.innerHTML = `
                    ? دسترسي به موقعيت رد شد.
                    <br><br>
                    <strong style="color:#d32f2f;">براي فعال کردن:</strong>
                    <ol style="text-align:right;margin:10px 20px;font-size:13px;line-height:2;">
                        <li>روي آدرس سايت در نوار آدرس کليک کنيد</li>
                        <li>گزينه <strong>"Allow location access"</strong> را انتخاب کنيد</li>
                        <li>سپس روي دکمه زير کليک کنيد</li>
                    </ol>
                    <button class="btn btn-sm btn-warning" onclick="location.reload()" style="margin-top:10px;">
                        ?? بروزرساني صفحه
                    </button>
                `;
            } else {
                statusDiv.textContent = '? خطا در دريافت موقعيت: ' + error.message;
            }
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

function checkLocationPermission_018() {
    const statusDiv = document.getElementById('locationStatus');
    statusDiv.textContent = '⏳ در حال بررسی مجدد دسترسی...';
    
    // کوئری مستقیم به Geolocation API
    navigator.geolocation.getCurrentPosition(
        function(position) {
            statusDiv.textContent = '✅ دسترسی به موقعیت داده شده است';
            startLocationTracking_011();
            
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const time = new Date().toISOString().replace('T', ' ').slice(0, 19);
            sendLocationToServer_013(lat, lng, time, function(success) {
                if (success) {
                    statusDiv.textContent = '✅ موقعیت با موفقیت ارسال شد';
                }
            });
        },
        function(error) {
            console.warn('Geolocation error:', error);
            
            if (error.code === 1) {
                statusDiv.innerHTML = `
                    ⛔ دسترسی به موقعیت داده نشد.
                    <br>
                    <span style="font-size:13px;color:#666;">

                    </button>
                `;
            } else {
                statusDiv.textContent = '❌ خطا در دریافت موقعیت: ' + error.message;
            }
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}
