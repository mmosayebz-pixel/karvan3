            const messageDiv = document.getElementById('createKarvanMessage');

function sendLocationNow_007() {
    const statusDiv = document.getElementById('locationStatus');
    statusDiv.textContent = '⏳ در حال دریافت موقعیت...';
    
    if (!navigator.geolocation) {
        statusDiv.textContent = '❌ مرورگر شما از موقعیت‌یابی پشتیبانی نمی‌کند';
        return;
    }
    
    // گزینه‌های موقعیت‌یابی با دقت بالا و timeout مناسب
    const options = {
        enableHighAccuracy: true,  // GPS را فعال می‌کند
        timeout: 15000,            // ۱۵ ثانیه timeout
        maximumAge: 60000          // حداکثر ۱ دقیقه کش کردن موقعیت
    };
    
    navigator.geolocation.getCurrentPosition(
        // تابع موفقیت
        function(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const time = new Date().toISOString().replace('T', ' ').slice(0, 19);
            
            // تلاش برای ارسال موقعیت
            sendLocationToServer_017(lat, lng, time, function(success) {
                if (success) {
                    statusDiv.textContent = '✅ موقعیت با موفقیت ارسال شد (GPS)';
                    setTimeout(() => {
                        statusDiv.textContent = '📡 موقعیت‌یابی فعال';
                    }, 3000);
                } else {
                    statusDiv.textContent = '❌ خطا در ارسال موقعیت';
                }
            });
        },
        // تابع خطا
        function(error) {
            console.warn('GPS Error:', error);
            
            // اگر GPS کار نکرد، از موقعیت تقریبی (IP یا WiFi) استفاده می‌کنیم
            statusDiv.textContent = '⏳ GPS در دسترس نیست، تلاش با روش جایگزین...';
            
            // استفاده از موقعیت‌یابی با دقت کمتر (از طریق WiFi/Internet)
            const fallbackOptions = {
                enableHighAccuracy: false,
                timeout: 10000,
                maximumAge: 120000
            };
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const time = new Date().toISOString().replace('T', ' ').slice(0, 19);
                    
                    sendLocationToServer_017(lat, lng, time, function(success) {
                        if (success) {
                            statusDiv.textContent = '✅ موقعیت با موفقیت ارسال شد (تقریبی)';
                            setTimeout(() => {
                                statusDiv.textContent = '📡 موقعیت‌یابی فعال (تقریبی)';
                            }, 3000);
                        } else {
                            statusDiv.textContent = '❌ خطا در ارسال موقعیت';
                        }
                    });
                },
                function(fallbackError) {
                    statusDiv.textContent = '❌ خطا در دریافت موقعیت: ' + fallbackError.message;
                    console.error('Fallback error:', fallbackError);
                },
                fallbackOptions
            );
        },
        options
    );
}
// پایان تابع sendLocationNow_007

        // تابع بارگذاری درخواست‌های جدید - شماره 008
        function loadPendingRequests_008() {
            const container = document.getElementById('pendingRequests');
            
            if (!currentSerial) {
                container.innerHTML = '<p class="message message-error">شماره سریال مشخص نیست</p>';
                return;
            }
            
            fetch(`karvan_manager.php?action=get_pending_requests&serial=${currentSerial}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    if (data.data.length === 0) {
                        container.innerHTML = '<p class="message message-info">هیچ درخواست جدیدی وجود ندارد</p>';
                        return;
                    }
                    
                    let html = '';
                    data.data.forEach(req => {
                        // استخراج نام کاربر از karvan_name
                        const parts = req.karvan_name.split(' - ');
                        const username = parts.length > 1 ? parts[1] : 'کاربر';
                        
                        html += `
                            <div class="card">
                                <h3>👤 ${username}</h3>
                                <p>📞 ${req.phone}</p>
                                <p>📅 ${req.created_at}</p>
                                <button class="btn btn-sm btn-success" onclick="approveUser_018(${req.id}, '${username}', '${req.phone}')">✅ تایید</button>
                                <button class="btn btn-sm btn-danger" onclick="rejectUser_019(${req.id})">❌ رد</button>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<p class="message message-error">${data.message}</p>`;
                }
            })
            .catch(error => {
                container.innerHTML = '<p class="message message-error">خطا در دریافت اطلاعات</p>';
                console.error('Error:', error);
            });
        }

    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {

            Object.values(mapMarkers).forEach(marker => {
                map.removeLayer(marker);
            });
            mapMarkers = {};
            
            if (data.data.length === 0) {
                // نمايش پيام روي نقشه
                const emptyDiv = document.createElement('div');
                emptyDiv.innerHTML = '?? هيچ موقعيتي ثبت نشده است';
                emptyDiv.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border-radius:10px;z-index:1000;';
                // اين پيام موقتي است و با بروزرساني بعدي حذف مي‌شود
                return;
            }
            
            // ايجاد نشانگر براي هر موقعيت
            data.data.forEach(loc => {
                const isLeader = loc.username === 'leader';
                const isSelf = loc.username === currentLeaderName;
                
                const iconColor = isLeader ? '#FF9800' : (isSelf ? '#2196F3' : '#4CAF50');
                const iconText = isLeader ? '??' : (isSelf ? '??' : '');
                
                const icon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div style="background-color:${iconColor};width:30px;height:30px;border-radius:50%;border:3px solid white;box-shadow:0 3px 10px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:14px;color:white;font-weight:bold;">${iconText}</div>`,
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                
                const marker = L.marker([loc.latitude, loc.longitude], { icon: icon })
                    .addTo(map)
                    .bindPopup(`
                        <div style="direction:rtl;text-align:right;font-family:Tahoma;">
                            <h4 style="margin:0 0 5px 0;color:#333;">${isLeader ? '?? ' : ''}${loc.username} ${isSelf ? '(شما)' : ''}</h4>
                            <hr style="margin:5px 0;">

                                <strong>زمان:</strong> ${loc.location_time}
                            </p>
                        </div>
                    `);
                
                mapMarkers[loc.username] = marker;
            });
            
            // تنظيم view براي نمايش همه نشانگرها
            if (Object.keys(mapMarkers).length > 0) {

                map.fitBounds(group.getBounds().pad(0.1));
            }
        } else {
            // نمايش خطا روي نقشه
            const errorDiv = document.createElement('div');
            errorDiv.innerHTML = '?? ' + data.message;
            errorDiv.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:20px;border-radius:10px;z-index:1000;';
        }
    })
    .catch(error => {
        console.error('Error:', error);
    });
}

// تابع درخواست مجوز موقعيت - شماره 022
function requestLocationPermission_022() {
    const statusDiv = document.getElementById('locationStatus');
    
    if (!navigator.geolocation) {
        statusDiv.textContent = '? مرورگر شما از موقعيت‌يابي پشتيباني نمي‌کند';
        return;
    }
    
    // بررسي وضعيت مجوز
    if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: 'geolocation' }).then(function(result) {
            if (result.state === 'granted') {
                statusDiv.textContent = '? دسترسي به موقعيت داده شده است';
                startLocationTracking_015();
            } else if (result.state === 'prompt') {
                statusDiv.textContent = '? درخواست دسترسي به موقعيت...';
                askForLocation_023();
            } else if (result.state === 'denied') {
                // اگر مجوز قبلاً رد شده، به کاربر آموزش مي‌دهيم که چطور در مرورگر فعال کند
                statusDiv.innerHTML = `
                    ? دسترسي به موقعيت در مرورگر رد شده است.
                    <br><br>
                    <strong style="color:#d32f2f;">براي فعال کردن:</strong>
                    <ol style="text-align:right;margin:10px 20px;font-size:13px;line-height:2;">
                        <li>روي آدرس سايت در نوار آدرس کليک کنيد</li>
                        <li>گزينه <strong>"Allow location access"</strong> يا <strong>"دسترسي به موقعيت"</strong> را انتخاب کنيد</li>
                        <li>سپس روي دکمه <strong>"بروزرساني"</strong> کليک کنيد</li>
                    </ol>
                    <button class="btn btn-sm btn-warning" onclick="location.reload()" style="margin-top:10px;">
                        ?? بروزرساني صفحه
                    </button>
                `;
            }
        }).catch(function() {
            // اگر Permission API پشتيباني نشد
            askForLocation_023();
        });
    } else {
        // مرورگر قديمي - مستقيماً درخواست مي‌کنيم
        askForLocation_023();
    }
}

// تابع درخواست موقعيت - شماره 023
function askForLocation_023() {
    const statusDiv = document.getElementById('locationStatus');
    statusDiv.textContent = '?? در حال دريافت مجوز موقعيت...';
    
    navigator.geolocation.getCurrentPosition(
        function(position) {
            statusDiv.textContent = '? دسترسي به موقعيت داده شد';
            
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const time = new Date().toISOString().replace('T', ' ').slice(0, 19);
            
            sendLocationToServer_017(lat, lng, time, function(success) {
                if (success) {
                    statusDiv.textContent = '? موقعيت با موفقيت ارسال شد';
                } else {
                    statusDiv.textContent = '?? موقعيت دريافت شد اما در ارسال خطا رخ داد';
                }
            });
            
            startLocationTracking_015();
        },
        function(error) {
            console.warn('Location permission denied:', error);
            
            // اگر کاربر مجوز را رد کرد، پيام راهنما نمايش بده
            if (error.code === 1) { // PERMISSION_DENIED
                statusDiv.innerHTML = `
                    ? دسترسي به موقعيت رد شد.
                    <br><br>
                    <strong style="color:#d32f2f;">براي فعال کردن:</strong>
                    <ol style="text-align:right;margin:10px 20px;font-size:13px;line-height:2;">
                        <li>روي آدرس سايت در نوار آدرس کليک کنيد</li>
                        <li>گزينه <strong>"Allow location access"</strong> را انتخاب کنيد</li>
                        <li>سپس روي دکمه زير کليک کنيد</li>
                    </ol>
                    <button class="btn btn-sm btn-warning" onclick="location.reload()" style="margin-top:10px;">
                        ?? بروزرساني صفحه
                    </button>
                `;
            } else {
                statusDiv.textContent = '? خطا در دريافت موقعيت: ' + error.message;
            }
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

function checkLocationPermission_025() {
    const statusDiv = document.getElementById('locationStatus');
    statusDiv.textContent = '? در حال بررسي مجدد دسترسي...';
    
    // 1. ابتدا يک کوئري مستقيم به Geolocation API بزنيم
    // اين کار باعث مي‌شود مرورگر وضعيت مجوز را دوباره بررسي کند
    navigator.geolocation.getCurrentPosition(
        // اگر موفق شد، يعني دسترسي داده شده
        function(position) {
            statusDiv.textContent = '? دسترسي به موقعيت داده شده است';
            // شروع رديابي
            startLocationTracking_015();
            // ارسال موقعيت فعلي
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const time = new Date().toISOString().replace('T', ' ').slice(0, 19);
            sendLocationToServer_017(lat, lng, time, function(success) {
                if (success) {
                    statusDiv.textContent = '? موقعيت با موفقيت ارسال شد';
                }
            });
        },
        // اگر خطا داد، بررسي کنيم که چه خطايي است
        function(error) {
            console.warn('Geolocation error:', error);
            
            // اگر خطا به خاطر اين است که مجوز داده نشده
            if (error.code === 1) { // PERMISSION_DENIED
                statusDiv.innerHTML = `
                    ? دسترسي به موقعيت داده نشد.
                    <br>
                    <span style="font-size:13px;color:#666;">
                        لطفاً از تنظيمات مرورگر دسترسي را فعال کنيد، سپس

                    </span>
                    <br><br>
                    <button class="btn btn-sm btn-primary" onclick="location.href=location.href" style="margin-top:5px;padding:8px 20px;">
                        ?? باز کردن مجدد صفحه
                    </button>
                `;
            } else {
                statusDiv.textContent = '? خطا در دريافت موقعيت: ' + error.message;
            }
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}
