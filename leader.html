<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>پنل رییس کاروان</title>
    <style>
        /* version_3 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', 'Arial', sans-serif;
        }
        body {
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #FF9800;
            font-size: 22px;
            text-align: center;
            margin-bottom: 20px;
        }
        h3 {
            color: #333;
            margin: 15px 0 10px;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #FF9800;
            outline: none;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            margin: 5px 0;
        }
        .btn-warning { background: #FF9800; color: white; }
        .btn-success { background: #4CAF50; color: white; }
        .btn-primary { background: #2196F3; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .btn-info { background: #00BCD4; color: white; }
        .btn-block { width: 100%; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .card {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border-right: 4px solid #FF9800;
        }
        .card h3 {
            font-size: 15px;
            color: #333;
            margin-top: 0;
        }
        .card p {
            font-size: 13px;
            color: #666;
            margin: 3px 0;
        }
        .hidden { display: none; }
        .message {
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
        }
        .message-success { background: #d4edda; color: #155724; }
        .message-error { background: #f8d7da; color: #721c24; }
        .message-info { background: #d1ecf1; color: #0c5460; }
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-active { background: #4CAF50; color: white; }
        .status-inactive { background: #f44336; color: white; }
        .status-pending { background: #FF9800; color: white; }
        .map-container {
            width: 100%;
            height: 400px;
            background: #e9ecef;
            border-radius: 12px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            font-size: 14px;
        }
        .chat-box {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
        }
        .chat-message {
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 10px;
            background: #f1f1f1;
        }
        .chat-message.leader {
            background: #FF9800;
            color: white;
        }
        .chat-message .user {
            font-weight: bold;
            font-size: 12px;
        }
        .chat-message .time {
            font-size: 10px;
            color: #999;
            float: left;
        }
        .table-container {
            overflow-x: auto;
            margin: 10px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            background: #FF9800;
            color: white;
            padding: 8px;
            text-align: right;
        }
        td {
            padding: 6px;
            border-bottom: 1px solid #ddd;
        }
        .location-status {
            padding: 8px;
            border-radius: 8px;
            background: #e9ecef;
            text-align: center;
            margin: 5px 0;
            font-size: 13px;
        }
        .custom-div-icon {
            background: transparent;
            border: none;
        }
        .leaflet-popup-content {
            min-width: 200px;
        }
        .checkbox-list {
            max-height: 250px;
            overflow-y: auto;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
            background: #fafafa;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 8px;
            margin: 4px 0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        .checkbox-item:hover {
            background: #fff3e0;
        }
        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin-left: 10px;
            cursor: pointer;
            transform: scale(1.3);
        }
        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
            flex: 1;
        }
        .route-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 20px;
            height: 5px;
            border-radius: 3px;
        }
        .user-locations-table {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin: 10px 0;
        }
        .user-locations-table table {
            margin: 0;
        }
        .user-locations-table th {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .speed-label {
            background: rgba(255,255,255,0.9);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            color: #333;
            border: 1px solid #FF9800;
            white-space: nowrap;
        }
        .selection-panel {
            background: #fff3e0;
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #FF9800;
        }
    </style>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

</head>

<body>
<script>alert('ver_7');</script>

    <div class="container">
        <!-- بخش انتخاب ورود -->
        <div id="entrySection">
            <h1>🚐 پنل رییس کاروان</h1>

            <button class="btn btn-warning btn-block" onclick="showCreateKarvan_001()">درخواست ایجاد کاروان جدید</button>
            <button class="btn btn-success btn-block" onclick="showLogin_002()">ورود به کاروان موجود</button>

            <div id="createKarvanSection" class="hidden">
                <h3>📝 درخواست کاروان جدید</h3>
                <div class="form-group">
                    <label>نام کاروان</label>
                    <input type="text" id="newKarvanName" placeholder="نام کاروان را وارد کنید">
                </div>
                <div class="form-group">
                    <label>شماره تماس</label>
                    <input type="text" id="newKarvanPhone" placeholder="شماره تماس را وارد کنید">
                </div>
                <button class="btn btn-primary btn-block" onclick="createKarvanRequest_003()">ارسال درخواست</button>
                <button class="btn btn-sm" onclick="hideCreateKarvan_004()">لغو</button>
                <div id="createKarvanMessage" class="message hidden"></div>
            </div>

            <div id="loginSection" class="hidden">
                <h3>🔐 ورود به کاروان</h3>
                <div class="form-group">
                    <label>شماره سریال کاروان</label>
                    <input type="number" id="leaderSerial" placeholder="شماره سریال را وارد کنید">
                </div>
                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="leaderPassword" placeholder="رمز عبور را وارد کنید">
                </div>
                <button class="btn btn-success btn-block" onclick="leaderLogin_005()">ورود</button>
                <button class="btn btn-sm" onclick="hideLogin_006()">لغو</button>
                <div id="loginMessage" class="message hidden"></div>
            </div>
        </div>

        <!-- بخش داشبورد رییس -->
        <div id="dashboardSection" class="hidden">
            <h1>🚐 <span id="karvanNameDisplay"></span></h1>

            <div class="location-status">
                <span id="locationStatus">⏳ در حال دریافت موقعیت...</span>
                <button class="btn btn-sm btn-info" onclick="sendLocationNow_007()">ارسال موقعیت لحظه‌ای</button>
            </div>

            <button class="btn btn-primary btn-block" onclick="loadPendingRequests_008()">بررسی درخواست‌های جدید</button>
            <div id="pendingRequests"></div>

            <button class="btn btn-info btn-block" onclick="loadMembersMap_009()">مشاهده اعضای کاروان در نقشه</button>
            <div id="mapContainer" class="map-container">
                <span>🌍 نقشه اعضای کاروان</span>
            </div>
            <button class="btn btn-sm btn-primary" onclick="updateMap_010()">بروز رسانی نقشه</button>

            <hr style="margin: 15px 0;">

            <!-- بخش مشاهده مسیر اعضا -->
            <h3>🛤️ مشاهده مسیر اعضا</h3>
            
            <div class="selection-panel">
                <div class="form-group">
                    <label>تعداد روزهای نمایش مسیر</label>
                    <input type="number" id="pathDays" value="10" min="1" max="365">
                </div>
                <button class="btn btn-sm btn-primary btn-block" onclick="saveRetentionDays_026()">💾 ذخیره تعداد روز</button>
                <button class="btn btn-sm btn-danger btn-block" onclick="cleanupLocations_027()">🗑️ پاکسازی مختصات قدیمی</button>
                <small style="display:block;margin-top:8px;color:#666;font-size:11px;">
                    مختصات قدیمی‌تر از تعداد روز تعیین‌شده، حذف خواهند شد.
                </small>
            </div>

            <button class="btn btn-warning btn-block" onclick="loadUserCheckboxes_028()">📋 انتخاب افراد برای نمایش مسیر</button>
            <div id="userCheckboxes" class="hidden">
                <div class="checkbox-list" id="userCheckboxList"></div>
                <button class="btn btn-success btn-block" onclick="showSelectedPaths_029()">🛤️ نمایش مسیر افراد انتخابی</button>
                <button class="btn btn-sm btn-danger" onclick="clearPaths_030()">پاک کردن مسیرها</button>
            </div>

            <div id="pathMapContainer" class="map-container" style="display:none;">
                <span>🌍 نقشه مسیر اعضا</span>
            </div>
            <div id="routeLegend" class="route-legend" style="display:none;"></div>

            <hr style="margin: 15px 0;">

            <!-- بخش مشاهده و حذف مختصات فرد -->
            <h3>📍 مختصات یک فرد</h3>
            <div class="form-group">
                <label>انتخاب فرد</label>
                <select id="userLocationsSelect">
                    <option value="">-- انتخاب کنید --</option>
                </select>
            </div>
            <button class="btn btn-info btn-block" onclick="loadUserLocations_031()">📋 نمایش مختصات فرد</button>
            <div id="userLocationsTable" class="user-locations-table hidden"></div>
            <button id="deleteSelectedLocationsBtn" class="btn btn-danger btn-block hidden" onclick="deleteSelectedLocations_032()">🗑️ حذف مختصات انتخاب‌شده</button>

            <hr style="margin: 15px 0;">

            <h3>💬 چت گروهی</h3>
            <div id="chatBox" class="chat-box">
                <p style="color:#999;text-align:center;">پیام‌ها در اینجا نمایش داده می‌شوند</p>
            </div>
            <div class="form-group" style="display:flex;gap:10px;">
                <input type="text" id="chatInput" placeholder="پیام خود را بنویسید..." style="flex:1;">
                <button class="btn btn-warning" onclick="sendChatMessage_011()">ارسال</button>
            </div>

            <button class="btn btn-sm btn-danger" onclick="deleteAllChatMessages_012()">حذف همه پیام‌ها</button>

            <hr style="margin: 15px 0;">

            <button class="btn btn-info btn-block" onclick="loadUsersManagement_013()">مدیریت کاربران</button>
            <div id="usersManagement"></div>

            <hr style="margin: 15px 0;">

            <button class="btn btn-danger btn-block" onclick="leaderLogout_014()">خروج</button>
        </div>
    </div>

    <script>
        // ============================================
        // version_3
        // متغیرهای سراسری
        // ============================================
        let currentSerial = '';
        let currentLeaderName = 'leader';
        let locationInterval = null;

        // ============================================
        // توابع پنل رییس - شماره‌گذاری شده
        // ============================================

        // تابع نمایش فرم ایجاد کاروان - شماره 001
        function showCreateKarvan_001() {
            document.getElementById('createKarvanSection').classList.remove('hidden');
            document.getElementById('loginSection').classList.add('hidden');
        }
        // پایان تابع showCreateKarvan_001

        // تابع نمایش فرم ورود - شماره 002
        function showLogin_002() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('createKarvanSection').classList.add('hidden');

            const savedSerial = localStorage.getItem('leader_serial');
            const savedPassword = localStorage.getItem('leader_password');
            if (savedSerial) document.getElementById('leaderSerial').value = savedSerial;
            if (savedPassword) document.getElementById('leaderPassword').value = savedPassword;
        }
        // پایان تابع showLogin_002

        // تابع ارسال درخواست ایجاد کاروان - شماره 003
        function createKarvanRequest_003() {
            const name = document.getElementById('newKarvanName').value.trim();
            const phone = document.getElementById('newKarvanPhone').value.trim();
            const messageDiv = document.getElementById('createKarvanMessage');

            if (!name || !phone) {
                showMessage_999(messageDiv, 'همه فیلدها را پر کنید', 'error');
                return;
            }

            fetch('karvan_manager.php?action=create_karvan_request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ karvan_name: name, phone: phone })
            })
            .then(response => response.json())
            .then(data => {
                showMessage_999(messageDiv, data.message, data.status);
                if (data.status === 'success') {
                    document.getElementById('newKarvanName').value = '';
                    document.getElementById('newKarvanPhone').value = '';
                }
            })
            .catch(error => {
                showMessage_999(messageDiv, 'خطا در ارتباط با سرور', 'error');
                console.error('Error:', error);
            });
        }
        // پایان تابع createKarvanRequest_003

        // تابع مخفی کردن فرم ایجاد کاروان - شماره 004
        function hideCreateKarvan_004() {
            document.getElementById('createKarvanSection').classList.add('hidden');
        }
        // پایان تابع hideCreateKarvan_004

        // تابع ورود رییس - شماره 005
        function leaderLogin_005() {
            const serial = document.getElementById('leaderSerial').value.trim();
            const password = document.getElementById('leaderPassword').value.trim();
            const messageDiv = document.getElementById('loginMessage');

            if (!serial || !password) {
                showMessage_999(messageDiv, 'همه فیلدها را پر کنید', 'error');
                return;
            }

            fetch('karvan_manager.php?action=leader_login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ serial: parseInt(serial), password: password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    currentSerial = serial;
                    document.getElementById('karvanNameDisplay').textContent = data.karvan_name;

                    localStorage.setItem('leader_serial', serial);
                    localStorage.setItem('leader_password', password);

                    document.getElementById('entrySection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');

                    requestLocationPermission_022();
                    loadChatMessages_016();
                    loadPendingRequests_008();
                    loadRetentionDays_025();
                    populateUserLocationsSelect_035();
                } else {
                    showMessage_999(messageDiv, data.message, 'error');
                }
            })
            .catch(error => {
                showMessage_999(messageDiv, 'خطا در ارتباط با سرور', 'error');
                console.error('Error:', error);
            });
        }
        // پایان تابع leaderLogin_005

        // تابع مخفی کردن فرم ورود - شماره 006
        function hideLogin_006() {
            document.getElementById('loginSection').classList.add('hidden');
        }
        // پایان تابع hideLogin_006

        // تابع ارسال موقعیت لحظه‌ای - شماره 007
        function sendLocationNow_007() {
            const statusDiv = document.getElementById('locationStatus');
            statusDiv.textContent = '⏳ در حال دریافت موقعیت...';

            if (!navigator.geolocation) {
                statusDiv.textContent = '❌ مرورگر شما از موقعیت‌یابی پشتیبانی نمی‌کند';
                return;
            }

            const options = {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 60000
            };

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const time = new Date().toISOString().replace('T', ' ').slice(0, 19);

                    sendLocationToServer_017(lat, lng, time, function(success) {
                        if (success) {
                            statusDiv.textContent = '✅ موقعیت با موفقیت ارسال شد (GPS)';
                            setTimeout(() => {
                                statusDiv.textContent = '📡 موقعیت‌یابی فعال';
                            }, 3000);
                        } else {
                            statusDiv.textContent = '❌ خطا در ارسال موقعیت';
                        }
                    });
                },
                function(error) {
                    console.warn('GPS Error:', error);
                    statusDiv.textContent = '⏳ GPS در دسترس نیست، تلاش با روش جایگزین...';

                    const fallbackOptions = {
                        enableHighAccuracy: false,
                        timeout: 10000,
                        maximumAge: 120000
                    };

                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            const time = new Date().toISOString().replace('T', ' ').slice(0, 19);

                            sendLocationToServer_017(lat, lng, time, function(success) {
                                if (success) {
                                    statusDiv.textContent = '✅ موقعیت با موفقیت ارسال شد (تقریبی)';
                                    setTimeout(() => {
                                        statusDiv.textContent = '📡 موقعیت‌یابی فعال (تقریبی)';
                                    }, 3000);
                                } else {
                                    statusDiv.textContent = '❌ خطا در ارسال موقعیت';
                                }
                            });
                        },
                        function(fallbackError) {
                            statusDiv.textContent = '❌ خطا در دریافت موقعیت: ' + fallbackError.message;
                            console.error('Fallback error:', fallbackError);
                        },
                        fallbackOptions
                    );
                },
                options
            );
        }
        // پایان تابع sendLocationNow_007

        // تابع بارگذاری درخواست‌های جدید - شماره 008
        function loadPendingRequests_008() {
            const container = document.getElementById('pendingRequests');

            if (!currentSerial) {
                container.innerHTML = '<p class="message message-error">شماره سریال مشخص نیست</p>';
                return;
            }

            fetch(`karvan_manager.php?action=get_pending_requests&serial=${currentSerial}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    if (data.data.length === 0) {
                        container.innerHTML = '<p class="message message-info">هیچ درخواست جدیدی وجود ندارد</p>';
                        return;
                    }

                    let html = '';
                    data.data.forEach(req => {
                        const parts = req.karvan_name.split(' - ');
                        const username = parts.length > 1 ? parts[1] : 'کاربر';

                        html += `
                            <div class="card">
                                <h3>👤 ${username}</h3>
                                <p>📞 ${req.phone}</p>
                                <p>📅 ${req.created_at}</p>
                                <button class="btn btn-sm btn-success" onclick="approveUser_018(${req.id}, '${username}', '${req.phone}')">✅ تایید</button>
                                <button class="btn btn-sm btn-danger" onclick="rejectUser_019(${req.id})">❌ رد</button>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<p class="message message-error">${data.message}</p>`;
                }
            })
            .catch(error => {
                container.innerHTML = '<p class="message message-error">خطا در دریافت اطلاعات</p>';
                console.error('Error:', error);
            });
        }
        // پایان تابع loadPendingRequests_008

        // تابع بارگذاری نقشه اعضا - شماره 009
        let map = null;
        let mapMarkers = {};

        function loadMembersMap_009() {
            const container = document.getElementById('mapContainer');

            if (!currentSerial) {
                container.innerHTML = '⚠️ شماره سریال مشخص نیست';
                return;
            }

            if (map) {
                updateMapMarkers_015();
                return;
            }

            container.innerHTML = '';
            container.style.height = '400px';
            container.style.width = '100%';

            map = L.map(container.id).setView([35.6892, 51.3890], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            updateMapMarkers_015();
        }
        // پایان تابع loadMembersMap_009

        // تابع بروزرسانی نقشه - شماره 010

        // تابع درخواست مجوز موقعیت - شماره 022
        function requestLocationPermission_022() {
            const statusDiv = document.getElementById('locationStatus');

            if (!navigator.geolocation) {
                statusDiv.textContent = '❌ مرورگر شما از موقعیت‌یابی پشتیبانی نمی‌کند';
                return;
            }

            if (navigator.permissions && navigator.permissions.query) {
                navigator.permissions.query({ name: 'geolocation' }).then(function(result) {
                    if (result.state === 'granted') {
                        statusDiv.textContent = '✅ دسترسی به موقعیت داده شده است';
                        startLocationTracking_015();
                    } else if (result.state === 'prompt') {
                        statusDiv.textContent = '⏳ درخواست دسترسی به موقعیت...';
                        askForLocation_023();
                    } else if (result.state === 'denied') {
                        statusDiv.innerHTML = `
                            ⛔ دسترسی به موقعیت در مرورگر رد شده است.
                            <br><br>
                            <strong style="color:#d32f2f;">برای فعال کردن:</strong>

                                🔄 بروزرسانی صفحه
                            </button>
                        `;

                    askForLocation_023();
                });
            } else {
                askForLocation_023();
            }
        }

                    const lat = position.coords.latitude;

                    const time = new Date().toISOString().replace('T', ' ').slice(0, 19);

                    sendLocationToServer_017(lat, lng, time, function(success) {
                        if (success) {
                            statusDiv.textContent = '✅ موقعیت با موفقیت ارسال شد';
                        } else {
                            statusDiv.textContent = '⚠️ موقعیت دریافت شد اما در ارسال خطا رخ داد';
                        }
                    });

                    startLocationTracking_015();

                function(error) {
                    console.warn('Location permission denied:', error);

                    if (error.code === 1) {
                        statusDiv.innerHTML = `

                alert('خطا در ارتباط با سرور');
                console.error('Error:', error);
            });
        }
        // پایان تابع cleanupLocations_027

        // تابع بارگذاری لیست کاربران برای انتخاب مسیر - شماره 028
        function loadUserCheckboxes_028() {
            const container = document.getElementById('userCheckboxes');
            const listContainer = document.getElementById('userCheckboxList');
            
            if (!currentSerial) {
                alert('شماره سریال مشخص نیست');
                return;
            }
            
            fetch(`karvan_manager.php?action=get_users_list&serial=${currentSerial}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    let html = '';
                    
                    // اضافه کردن رییس کاروان
                    html += `
                        <div class="checkbox-item">
                            <input type="checkbox" id="user_leader" value="leader">
                            <label for="user_leader">👑 رییس کاروان (leader)</label>
                        </div>
                    `;
                    
                    // اضافه کردن سایر کاربران
                    data.data.forEach(user => {
                        html += `
                            <div class="checkbox-item">

                        `;

        // پایان تابع loadUserCheckboxes_028

        // تابع نمایش مسیر افراد انتخاب‌شده - شماره 029
        let pathMap = null;
        let pathLayers = [];
        
        function showSelectedPaths_029() {
            const checkboxes = document.querySelectorAll('#userCheckboxList input[type="checkbox"]:checked');
            
            if (checkboxes.length === 0) {
                alert('لطفاً حداقل یک نفر را انتخاب کنید');
                return;
            }
            
            const usernames = Array.from(checkboxes).map(cb => cb.value);
            const days = parseInt(document.getElementById('pathDays').value) || 10;
            
            fetch(`karvan_manager.php?action=get_path&serial=${currentSerial}&usernames=${encodeURIComponent(usernames.join(','))}&days=${days}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const pathContainer = document.getElementById('pathMapContainer');
                    pathContainer.style.display = 'block';
                    pathContainer.innerHTML = '';
                    
                    if (!pathMap) {
                        pathMap = L.map(pathContainer.id).setView([35.6892, 51.3890], 10);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            attribution: '© OpenStreetMap contributors'
                        }).addTo(pathMap);
                    }
                    
                    // پاک کردن لایه‌های قبلی
                    pathLayers.forEach(layer => pathMap.removeLayer(layer));
                    pathLayers = [];
                    
                    const colors = ['#FF9800', '#2196F3', '#4CAF50', '#f44336', '#9C27B0', '#00BCD4', '#FF5722', '#795548', '#607D8B', '#E91E63'];
                    const legendItems = [];
                    let colorIndex = 0;
                    
                    const allPoints = [];
                    
                    for (const username in data.data) {
                        const points = data.data[username];
                        if (points.length === 0) continue;
                        
                        const color = colors[colorIndex % colors.length];
                        colorIndex++;
                        
                        legendItems.push({ username: username, color: color });
                        
                        // ایجاد خط مسیر
                        const latlngs = points.map(p => [parseFloat(p.latitude), parseFloat(p.longitude)]);
                        allPoints.push(...latlngs);
                        
                        const polyline = L.polyline(latlngs, {
                            color: color,
                            weight: 4,
                            opacity: 0.7
                        }).addTo(pathMap);
                        pathLayers.push(polyline);
                        
                        // ایجاد نشانگر برای هر نقطه
                        points.forEach((point, idx) => {
                            const marker = L.circleMarker([parseFloat(point.latitude), parseFloat(point.longitude)], {
                                radius: 5,
                                fillColor: color,
                                color: 'white',
                                weight: 2,
                                opacity: 1,
                                fillOpacity: 0.9
                            }).addTo(pathMap);
                            
                            marker.bindPopup(`
                                <div style="direction:rtl;text-align:right;font-family:Tahoma;">
                                    <h4 style="margin:0 0 5px 0;color:#333;">${username}</h4>
                                    <hr style="margin:5px 0;">
                                    <p style="margin:3px 0;font-size:13px;color:#666;">
                                        <strong>عرض:</strong> ${point.latitude}<br>
                                        <strong>طول:</strong> ${point.longitude}<br>
                                        <strong>زمان:</strong> ${point.location_time}
                                    </p>
                                </div>
                            `);
                            pathLayers.push(marker);
                            
                            // محاسبه و نمایش سرعت بین دو نقطه
                            if (idx > 0) {
                                const prevPoint = points[idx - 1];
                                const speed = calculateSpeed_033(
                                    parseFloat(prevPoint.latitude),
                                    parseFloat(prevPoint.longitude),
                                    parseFloat(point.latitude),
                                    parseFloat(point.longitude),
                                    prevPoint.location_time,
                                    point.location_time
                                );
                                
                                if (speed !== null && speed > 0) {
                                    const midLat = (parseFloat(prevPoint.latitude) + parseFloat(point.latitude)) / 2;
                                    const midLng = (parseFloat(prevPoint.longitude) + parseFloat(point.longitude)) / 2;
                                    
                                    const speedMarker = L.marker([midLat, midLng], {
                                        icon: L.divIcon({
                                            className: 'speed-label-icon',
                                            html: `<div class="speed-label">${speed.toFixed(1)} km/h</div>`,
                                            iconSize: [80, 20],
                                            iconAnchor: [40, 10]
                                        })
                                    }).addTo(pathMap);
                                    
                                    speedMarker.bindPopup(`
                                        <div style="direction:rtl;text-align:right;font-family:Tahoma;">
                                            <strong>سرعت:</strong> ${speed.toFixed(2)} کیلومتر بر ساعت<br>
                                            <strong>از:</strong> ${prevPoint.location_time}<br>
                                            <strong>تا:</strong> ${point.location_time}
                                        </div>
                                    `);
                                    
                                    pathLayers.push(speedMarker);
                                }
                            }
                        });
                    }
                    
                    // تنظیم view
                    if (allPoints.length > 0) {
                        pathMap.fitBounds(L.latLngBounds(allPoints).pad(0.1));
                    }
                    
                    // نمایش راهنما
                    const legendContainer = document.getElementById('routeLegend');
                    let legendHtml = '';
                    legendItems.forEach(item => {
                        const displayName = item.username === 'leader' ? '👑 رییس کاروان' : '👤 ' + item.username;
                        legendHtml += `
                            <div class="legend-item">
                                <div class="legend-color" style="background:${item.color};"></div>
                                <span>${displayName}</span>
                            </div>
                        `;
                    });
                    legendContainer.innerHTML = legendHtml;
                    legendContainer.style.display = 'flex';
                    
                    // اسکرول به نقشه
                    pathContainer.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert('خطا: ' + data.message);
                }
            })
            .catch(error => {
                alert('خطا در ارتباط با سرور');
                console.error('Error:', error);
            });
        }
        // پایان تابع showSelectedPaths_029

        // تابع پاک کردن مسیرها - شماره 030
        function clearPaths_030() {
            pathLayers.forEach(layer => pathMap.removeLayer(layer));
            pathLayers = [];
            document.getElementById('pathMapContainer').style.display = 'none';
            document.getElementById('routeLegend').style.display = 'none';
        }
        // پایان تابع clearPaths_030

        // تابع بارگذاری مختصات یک فرد - شماره 031
        function loadUserLocations_031() {
            const select = document.getElementById('userLocationsSelect');
            const username = select.value;
            
            if (!username) {
                alert('لطفاً یک فرد انتخاب کنید');
                return;
            }
            
            fetch(`karvan_manager.php?action=get_user_locations&serial=${currentSerial}&username=${encodeURIComponent(username)}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    const container = document.getElementById('userLocationsTable');
                    
                    if (data.data.length === 0) {
                        container.innerHTML = '<p style="text-align:center;padding:20px;color:#999;">هیچ مختصاتی برای این فرد ثبت نشده است</p>';
                        container.classList.remove('hidden');
                        document.getElementById('deleteSelectedLocationsBtn').classList.add('hidden');
                        return;
                    }
                    
                    let html = '<table>';
                    html += '<tr><th><input type="checkbox" id="selectAllLocations" onchange="toggleAllLocations_034(this)"></th><th>#</th><th>عرض</th><th>طول</th><th>زمان</th></tr>';
                    
                    data.data.forEach((loc, idx) => {
                        html += `
                            <tr>
                                <td><input type="checkbox" class="location-checkbox" value="${loc.id}"></td>
                                <td>${idx + 1}</td>
                                <td>${loc.latitude}</td>
                                <td>${loc.longitude}</td>
                                <td style="font-size:11px;">${loc.location_time}</td>
                            </tr>
                        `;
                    });
                    
                    html += '</table>';
                    container.innerHTML = html;
                    container.classList.remove('hidden');
                    document.getElementById('deleteSelectedLocationsBtn').classList.remove('hidden');
                } else {
                    alert('خطا: ' + data.message);
                }
            })
            .catch(error => {
                alert('خطا در ارتباط با سرور');
                console.error('Error:', error);
            });
        }
        // پایان تابع loadUserLocations_031

        // تابع حذف مختصات انتخاب‌شده - شماره 032
        function deleteSelectedLocations_032() {
            const checkboxes = document.querySelectorAll('.location-checkbox:checked');
            
            if (checkboxes.length === 0) {
                alert('لطفاً حداقل یک مختصات را انتخاب کنید');
                return;
            }
            
            if (!confirm(`آیا از حذف ${checkboxes.length} مختصات مطمئن هستید؟`)) return;
            
            const ids = Array.from(checkboxes).map(cb => parseInt(cb.value));
            const username = document.getElementById('userLocationsSelect').value;
            
            fetch('karvan_manager.php?action=delete_user_locations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    serial: parseInt(currentSerial),
                    username: username,
                    location_ids: ids
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(`✅ ${data.message}`);
                    loadUserLocations_031();
                } else {
                    alert('خطا: ' + data.message);
                }
            })
            .catch(error => {
                alert('خطا در ارتباط با سرور');
                console.error('Error:', error);
            });
        }
        // پایان تابع deleteSelectedLocations_032

        // تابع محاسبه سرعت بین دو نقطه - شماره 033
        function calculateSpeed_033(lat1, lon1, lat2, lon2, time1, time2) {
            try {
                // محاسبه فاصله با فرمول هاورساین
                const R = 6371; // شعاع زمین به کیلومتر
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                const distance = R * c;
                
                // محاسبه زمان به ساعت
                const t1 = new Date(time1.replace(' ', 'T')).getTime();
                const t2 = new Date(time2.replace(' ', 'T')).getTime();
                const timeDiffHours = Math.abs(t2 - t1) / (1000 * 60 * 60);
                
                if (timeDiffHours < 0.001) return null;
                
                const speed = distance / timeDiffHours;
                return speed;
            } catch (e) {
                return null;
            }
        }
        // پایان تابع calculateSpeed_033

        // تابع انتخاب/لغو همه مختصات - شماره 034
        function toggleAllLocations_034(checkbox) {
